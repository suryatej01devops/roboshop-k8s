apiVersion: v1
kind: PersistentVolumeClaim
metadata: 
  name : ebs-dynamic
spec: 
  storageClassName: "roboshop-ebs"
  accessModes :
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
spec:
  containers:   
  - name: nginx
    image: nginx:latest
    volumeMounts:
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: ebs-dynamic