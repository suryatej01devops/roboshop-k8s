apiVersion: v1
kind: PersistentVolume
metadata:
  name: ebs-static
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 15Gi
  persistentVolumeReclaimPolicy: Retain
  #retain means dont delete the data,delete means delete data and disk ,recycle means delete the data dont delete the disk
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-0909349e8414a8b55
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: 
  name : ebs-static
spec: 
  storageClassName: ""
  volumeName: ebs-static
  accessModes :
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ngnix
spec:
  containers:
  - name: ngnix
    image: ngnix
    volumeMounts:
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: ebs-claim
