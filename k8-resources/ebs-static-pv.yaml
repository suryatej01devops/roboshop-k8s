apiVersion: v1
kind: PersistentVolume
metadata:
  name: ebs-static
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 15Gi
  persistentVolumeReclaimPolicy: Retain
  #retain means dont delete the data,delete means delete data and disk ,recycle means delete the data dont delete the disk
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-0b6048700a2d53c59
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: 
  name : ebs-static
spec: 
  storageClassName: ""
  volumeName: ebs-static
  accessModes :
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
spec:
  containers:   
  - name: nginx
    image: nginx:latest
    volumeMounts:
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  nodeSelector: 
    topology.kubernetes.io/zone: us-east-1f
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: ebs-static
