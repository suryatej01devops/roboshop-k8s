apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    purpose: dp-demo
    project: roboshop  
spec:
  replicas: 4
  selector:
    matchLabels:
      labels: 
        purpose: dp-demo-headless-service
        project: roboshop
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        volumeMounts:
        - name: persistent-storage
          mountPath: /usr/share/nginx/html
      volumes:
      - name: persistent-storage
        persistentVolumeClaim:
          claimName: ebs-dynamic
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    purpose: dp-demo-headless-service
    project: roboshop
    
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80  
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels :
    purpose: dp-demo-headless-service
    project: roboshop
spec:
  clusterIP: None
  selector:
    purpose: dp-demo
    project: roboshop
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80      