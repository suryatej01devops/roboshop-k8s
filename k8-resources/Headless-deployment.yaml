apiVersion: v1
kind: Pod
metadata:
  name: nginx
spec:
  containers:   
  - name: nginx
    image: nginx:latest
    volumeMounts:
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: ebs-dynamic
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    project: roboshop
    component: frontend
    envirnoment: dev
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80  
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  clusterIP: None
  selector:
    project: roboshop
    component: frontend
    envirnoment: dev
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80      